# Security headers for every response (included in each location: nginx drops server-level
# add_header lines in a location that has its own).
# CSP: everything comes from this app. 'wasm-unsafe-eval' is for the LittleFS WebAssembly that
# builds the UF2; inline styles are React's style attributes; data:/blob: are canvas textures and
# downloads. frame-ancestors/X-Frame-Options: other sites can't put the app in a frame (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=()" always;
