# Requests for any other host name are refused: a website can point its own domain at 127.0.0.1
# ("DNS rebinding") and would otherwise be treated as this app. Add names here (and to the API's
# ALLOWED_HOSTS) only if you open the app under another name on purpose.
map $host $known_host {
  default 0;
  localhost 1;
  127.0.0.1 1;
  "[::1]" 1;
  ~\.localhost$ 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  if ($known_host = 0) {
    return 421;
  }

  location /api/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # SSE streams (agent output, Milestone 4+) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html names the current /assets/ files, so the browser must ask for it again every time;
  # without this it kept an old copy after a rebuild and showed the previous version of the app.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
