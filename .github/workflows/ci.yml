# Checks every change that reaches GitHub: types, all tests (circuit-core safety rules, part packs,
# API, web, desktop helpers) on Linux, macOS and Windows, and the dependency audit.
# No secrets are used. Release builds on a tag come later (PLAN §13.13, 18.6).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Some tests compare generated files byte for byte: keep LF line endings on Windows too.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Exact versions from package-lock.json; install scripts off (nothing the tests need runs there).
      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Fails on any high or critical finding, in what the app ships and in the development tools.
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

      # Every installed package must carry a valid npm registry signature.
      - name: Registry signatures
        run: npm audit signatures
